<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS HUD — Voice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --holo: #ffb454; --ink: #0b0805;
    /* Amplitude-driven levers. JS rewrites these on every animation frame while
       the TTS clip plays, and resets them to exactly these idle values when it
       ends, so the whole reactive layer collapses to "off" with no leftovers. */
    --amp: 0; --hue: 0deg; --bright: 1; --sat: 1; --glow: 0; --glow-r: 48vmin; }
  html, body { height: 100%; background: var(--ink); overflow: hidden;
    font-family: Archivo, system-ui, sans-serif; color: #f2ead9; }

  /* Page = HUD only. The glow and the status strip float over it; the glow is
     pointer-events:none, the strip is a thin non-blocking overlay. */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; display: block; filter: none; transition: filter .12s linear; }
  /* The artifact's canvas orb reacts to its own internal speaking state, which we
     cannot reach. So the reconstruction is driven wrapper-side, from the live
     amplitude of the TTS waveform, instead of a fixed breathing keyframe. */
  #hud.speaking { filter: hue-rotate(var(--hue)) brightness(var(--bright)) saturate(var(--sat)); }
  #hud.listening { filter: hue-rotate(-12deg) brightness(1.05); transition: filter .3s; }

  /* Voice overlay — subtle full-screen tint only */
  #jv-glow { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity .25s; box-shadow: inset 0 0 160px color-mix(in srgb, var(--holo) 40%, transparent); }
  /* Speaking: not a tint but a soft radial disc sitting behind the orb, whose
     radius (--glow-r) and brightness (--glow) both track speech energy. */
  #jv-glow.speak { opacity: 1; box-shadow: none; }
  #jv-glow.speak::after { content: ''; position: absolute; left: 50%; top: 50%;
    width: calc(var(--glow-r) * 2); height: calc(var(--glow-r) * 2);
    margin: calc(var(--glow-r) * -1) 0 0 calc(var(--glow-r) * -1);
    border-radius: 50%; opacity: var(--glow); mix-blend-mode: screen;
    transition: opacity .08s linear;
    background: radial-gradient(circle,
      color-mix(in srgb, var(--holo) 34%, transparent) 0%,
      color-mix(in srgb, var(--holo) 14%, transparent) 46%,
      transparent 72%); }
  #jv-glow.listen { opacity: 1; animation: jvBreathe 1.1s ease-in-out infinite;
    box-shadow: inset 0 0 190px color-mix(in srgb, #9dff8a 45%, transparent); }
  #jv-glow.think { opacity: .55;
    box-shadow: inset 0 0 140px color-mix(in srgb, #6ec3ff 40%, transparent); }
  @keyframes jvBreathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  /* ------------------------------------------------------------ speaking rings */
  /* Rings launched from the orb's edge while JARVIS talks. The orb sits at the
     viewport centre, so the container does too; --r is the base radius. */
  #jv-rings { position: fixed; inset: 0; z-index: 50; pointer-events: none;
    display: none; --r: 24vmin; }
  #jv-rings.speak { display: block; }
  #jv-rings i { position: absolute; left: 50%; top: 50%; display: block;
    width: calc(var(--r) * 2); height: calc(var(--r) * 2); margin: calc(var(--r) * -1) 0 0 calc(var(--r) * -1);
    border-radius: 50%; opacity: 0;
    border: 1px solid color-mix(in srgb, var(--holo) calc(45% + var(--amp) * 55%), transparent); }
  /* Rings are no longer three looping elements on fixed delays: JS launches one
     from the orb's edge on every fresh amplitude peak and drops it on animationend. */
  #jv-rings i.jv-ring-spawn { animation: jvRingSpawn 2.2s ease-out 1 both; }
  @keyframes jvRingSpawn {
    0%   { transform: scale(.55); opacity: 0; }
    14%  { opacity: calc(.28 + var(--amp) * .42); }
    100% { transform: scale(1.45); opacity: 0; }
  }

  /* ------------------------------------------------------------ status strip */
  /* Voice-only UI: a thin floating readout in the corner. No transcript, no
     input. It never eats clicks except on its own two fallback buttons. */
  #jv-head { position: fixed; z-index: 60; left: 16px; bottom: 14px;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 13px; border-radius: 999px; pointer-events: none;
    background: color-mix(in srgb, #0b0805 72%, transparent);
    border: 1px solid color-mix(in srgb, var(--holo) 25%, transparent);
    backdrop-filter: blur(6px); }
  #jv-head .jv-btn { pointer-events: auto; }
  #jv-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto;
    background: color-mix(in srgb, var(--holo) 70%, transparent);
    box-shadow: 0 0 10px var(--holo); transition: background .2s, box-shadow .2s; }
  #jv-dot.listen { background: #9dff8a; box-shadow: 0 0 16px #9dff8a; animation: jvPulse .9s infinite; }
  #jv-dot.think  { background: #6ec3ff; box-shadow: 0 0 16px #6ec3ff; animation: jvPulse 1.4s infinite; }
  #jv-dot.speak  { background: var(--holo); box-shadow: 0 0 20px var(--holo); animation: jvPulse .7s infinite; }
  #jv-dot.dead   { background: #ec3013; box-shadow: 0 0 12px #ec3013; animation: none; }
  @keyframes jvPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.45); } }

  #jv-status { font: 700 11px/1.4 Archivo, system-ui; letter-spacing: .2em;
    text-transform: uppercase; color: color-mix(in srgb, var(--holo) 80%, #fff); }
  #jv-status.live { color: #9dff8a; }
  #jv-level { width: 74px; height: 4px; border-radius: 3px; overflow: hidden; flex: 0 0 auto;
    background: color-mix(in srgb, var(--holo) 18%, transparent); }
  #jv-level i { display: block; height: 100%; width: 0%; background: var(--holo);
    transition: width .08s linear; }
  #jv-actions { display: flex; gap: 8px; }

  .jv-btn { cursor: pointer; border: none; border-radius: 999px; padding: 6px 13px;
    font: 800 10px/1 Archivo, system-ui; letter-spacing: .18em; text-transform: uppercase;
    color: #0b0805; background: var(--holo); }
  .jv-btn:hover { filter: brightness(1.12); }
  /* Fallback controls — only shown when they are actually needed */
  #jv-retry, #jv-unlock, #jv-end { display: none; }
  #jv-retry.show, #jv-unlock.show, #jv-end.show { display: inline-block; }

  /* ------------------------------------------------------------ terminal chat */
  /* Wrapper-side (NOT iframe) typed path. It sits above #jv-head and never
     covers the artifact's own footer controls. The container itself is
     click-through; only the transcript and the input strip take pointer events,
     so the mic path inside the iframe keeps working untouched. */
  #jv-chat { position: fixed; z-index: 60; left: 0; right: 0; bottom: 104px;
    width: min(720px, calc(100% - 32px)); margin: 0 auto;
    display: flex; flex-direction: column; gap: 9px; pointer-events: none;
    font-family: Archivo, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: color-mix(in srgb, var(--holo) 86%, #fff); }

  #jv-log { pointer-events: auto; overflow-y: auto; max-height: 34vh;
    display: flex; flex-direction: column; gap: 6px; padding: 0 2px;
    scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--holo) 35%, transparent) transparent; }
  #jv-log::-webkit-scrollbar { width: 4px; }
  #jv-log::-webkit-scrollbar-thumb { border-radius: 3px;
    background: color-mix(in srgb, var(--holo) 35%, transparent); }

  .jv-line { max-width: 86%; white-space: pre-wrap; word-break: break-word;
    font: 500 13px/1.55 Archivo, ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .02em; text-shadow: 0 0 12px color-mix(in srgb, var(--holo) 22%, transparent); }
  .jv-line::before { content: '> '; opacity: .5; }
  .jv-line-user { align-self: flex-end; text-align: right;
    color: color-mix(in srgb, var(--holo) 70%, #fff); }
  /* The HUD line shows the reply currently being spoken; this panel is the
     scrollback. Hiding these outright (to kill the duplicate display) left the
     transcript showing only the user's own prompts, so every past reply
     vanished and the history looked frozen on one answer. Dimmed instead:
     the live line reads from the HUD, the record stays here. */
  .jv-line-jarvis { align-self: flex-start; opacity: .62;
    color: color-mix(in srgb, var(--holo) 92%, #fff); }
  /* Block caret, alive only while the typewriter is still revealing the line. */
  .jv-line-jarvis.jv-typing .jv-text::after { content: '▌'; margin-left: 1px;
    animation: jvCaret .7s step-end infinite; }
  @keyframes jvCaret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* JARVIS's real reply, drawn OVER the HUD's own scripted line. The HUD cycles
     canned dialogue ("THE SCAN IS ARCHIVED TO THE MALIBU SERVER, SIR.") from
     its own timers and re-renders that subtree constantly, so writing into it
     is a fight we lose. This overlay lives in the wrapper document instead —
     React cannot touch it — and is positioned over the HUD line each frame. */
  #jv-hudline { position: absolute; display: none; z-index: 40;
    align-items: center; justify-content: center; text-align: center;
    font: 600 13px/20.15px Archivo, system-ui, sans-serif; letter-spacing: 1.69px;
    color: rgb(255, 225, 187); pointer-events: none; padding: 0 6px;
    background: #0b0a08; }
  #jv-hudline.show { display: flex; }
  #jv-hudline .jv-hl-label { color: rgb(255, 225, 187); opacity: .85; margin-right: 7px;
    white-space: nowrap; }
  #jv-hudline.jv-typing .jv-hl-text::after { content: '▌'; margin-left: 1px;
    animation: jvCaret .7s step-end infinite; }

  /* Left column: replaces ARCHIVE CRATE 07 / MASS / COMPOSITION / INTEGRITY,
     which are pure set dressing, with the local model's real figures. */
  #jv-left { position: absolute; display: none; z-index: 46; flex-direction: column;
    gap: 6px; pointer-events: none; background: #0b0a08;
    font-family: Archivo, system-ui, sans-serif; padding-top: 2px; }
  #jv-left.show { display: flex; }
  #jv-left .jv-lf-label { font: 600 10.5px/1.3 Archivo, system-ui; letter-spacing: .18em;
    text-transform: uppercase; color: color-mix(in srgb, var(--holo) 55%, #fff); opacity: .72; }
  #jv-left .jv-lf-model { font: 800 21px/1.15 Archivo, system-ui; letter-spacing: .01em;
    color: color-mix(in srgb, var(--holo) 96%, #fff); }
  #jv-left .jv-lf-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 1px; }
  #jv-left .jv-lf-chip { font: 700 9.5px/1 Archivo, system-ui; letter-spacing: .14em;
    text-transform: uppercase; padding: 4px 7px; border-radius: 3px;
    border: 1px solid color-mix(in srgb, var(--holo) 34%, transparent);
    color: color-mix(in srgb, var(--holo) 88%, #fff); }
  #jv-left .jv-lf-chip.ok { border-color: color-mix(in srgb, #9dff8a 45%, transparent); color: #9dff8a; }
  #jv-left .jv-lf-row { display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; font: 600 11.5px/1.5 Archivo, system-ui; letter-spacing: .05em; }
  #jv-left .jv-lf-k { color: color-mix(in srgb, var(--holo) 60%, #fff); opacity: .76;
    text-transform: uppercase; white-space: nowrap; }
  #jv-left .jv-lf-v { color: color-mix(in srgb, var(--holo) 95%, #fff); white-space: nowrap; }
  #jv-left .jv-lf-sec { font: 700 10.5px/1.3 Archivo, system-ui; letter-spacing: .18em;
    text-transform: uppercase; color: color-mix(in srgb, var(--holo) 62%, #fff);
    opacity: .8; margin-top: 6px;
    border-top: 1px solid color-mix(in srgb, var(--holo) 18%, transparent); padding-top: 7px; }
  /* Context budget: prompt / output / headroom as a share of the real window. */
  #jv-left .jv-lf-bar { height: 5px; border-radius: 3px; overflow: hidden; display: flex;
    background: color-mix(in srgb, var(--holo) 14%, transparent); margin-top: 3px; }
  #jv-left .jv-lf-bar i { display: block; height: 100%; width: 0%; transition: width .3s; }
  #jv-left .jv-lf-bar i.p { background: var(--holo); }
  #jv-left .jv-lf-bar i.o { background: #9dff8a; }

  /* Live telemetry, drawn over the HUD's fake THREAT ASSESSMENT block. Same
     overlay approach as the transcript: the HUD re-renders that subtree from
     React state, so anything written into it is wiped within the second. */
  #jv-stats { position: absolute; display: none; z-index: 46; flex-direction: column;
    gap: 5px; pointer-events: none; padding: 2px 0 0 0;
    background: #0b0a08; font-family: Archivo, system-ui, sans-serif; }
  #jv-stats.show { display: flex; }
  #jv-stats .jv-st-title { font: 700 11px/1.4 Archivo, system-ui; letter-spacing: .2em;
    text-transform: uppercase; color: color-mix(in srgb, var(--holo) 78%, #fff);
    opacity: .9; margin-bottom: 3px; }
  #jv-stats .jv-st-row { display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; font: 600 11.5px/1.5 Archivo, system-ui; letter-spacing: .06em; }
  #jv-stats .jv-st-k { color: color-mix(in srgb, var(--holo) 62%, #fff); opacity: .78;
    text-transform: uppercase; white-space: nowrap; }
  #jv-stats .jv-st-v { color: color-mix(in srgb, var(--holo) 95%, #fff);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #jv-stats .jv-st-v.ok   { color: #9dff8a; }
  #jv-stats .jv-st-v.warn { color: #ffb454; }
  #jv-stats .jv-st-v.bad  { color: #ec6a4c; }
  /* Mic/TTS amplitude — the one genuinely live signal the client already has. */
  #jv-stats .jv-st-meter { height: 4px; border-radius: 3px; overflow: hidden; margin-top: 2px;
    background: color-mix(in srgb, var(--holo) 16%, transparent); }
  #jv-stats .jv-st-meter i { display: block; height: 100%; width: 0%;
    background: var(--holo); transition: width .08s linear; }

  /* Conversation transcript, parked in the HUD's empty right column (verified
     310x505 of nothing under the PROTOCOL row). Lives in the wrapper document
     and is positioned over the iframe, so the HUD's own React re-renders cannot
     disturb it. The typed input stays where it is at the bottom. */
  #jv-side { position: absolute; display: none; z-index: 45; flex-direction: column;
    pointer-events: none; padding: 2px 2px 0 2px; }
  #jv-side.show { display: flex; }
  #jv-side-head { flex: 0 0 auto; font: 700 11px/1.4 Archivo, system-ui;
    letter-spacing: .2em; text-transform: uppercase;
    color: color-mix(in srgb, var(--holo) 78%, #fff); opacity: .9;
    padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid color-mix(in srgb, var(--holo) 22%, transparent); }
  #jv-side-log { flex: 1 1 auto; overflow-y: auto; pointer-events: auto;
    display: flex; flex-direction: column; gap: 7px; padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--holo) 35%, transparent) transparent; }
  #jv-side-log::-webkit-scrollbar { width: 4px; }
  #jv-side-log::-webkit-scrollbar-thumb { border-radius: 3px;
    background: color-mix(in srgb, var(--holo) 35%, transparent); }
  /* The old bottom transcript is superseded by the side panel; the input stays. */
  #jv-log { display: none; }

  #jv-input-wrap { pointer-events: auto; display: flex; align-items: center; gap: 9px;
    padding: 9px 15px; border-radius: 999px;
    background: color-mix(in srgb, #0b0805 76%, transparent);
    border: 1px solid color-mix(in srgb, var(--holo) 26%, transparent);
    backdrop-filter: blur(6px); transition: border-color .2s, box-shadow .2s; }
  #jv-input-wrap::before { content: '>'; flex: 0 0 auto; opacity: .6;
    font: 700 13px/1 Archivo, ui-monospace, monospace; color: var(--holo); }
  #jv-input-wrap:focus-within { border-color: color-mix(in srgb, var(--holo) 55%, transparent);
    box-shadow: 0 0 22px color-mix(in srgb, var(--holo) 18%, transparent); }
  #jv-input-wrap.jv-err { border-color: #ec3013; box-shadow: 0 0 20px color-mix(in srgb, #ec3013 40%, transparent); }

  #jv-input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent;
    font-family: Archivo, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 600; letter-spacing: .08em;
    color: color-mix(in srgb, var(--holo) 92%, #fff); caret-color: var(--holo); }
  #jv-input::placeholder { color: color-mix(in srgb, var(--holo) 45%, transparent);
    letter-spacing: .16em; font-weight: 700; }

  /* Layer 1 (Intake) "did you mean?" clarification chips */
  #jv-clarify-root { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .jv-clarify {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    pointer-events: auto; max-width: min(560px, 92vw);
    display: flex; flex-direction: column; gap: 10px; padding: 16px 18px;
    background: color-mix(in srgb, #05070d 88%, var(--holo));
    border: 1px solid color-mix(in srgb, var(--holo) 55%, transparent);
    border-radius: 14px; backdrop-filter: blur(8px);
    box-shadow: 0 0 28px color-mix(in srgb, var(--holo) 30%, transparent);
    font-family: Archivo, system-ui, sans-serif; animation: jvClarifyIn .18s ease-out;
  }
  @keyframes jvClarifyIn { from { opacity: 0; transform: translate(-50%, 8px); } }
  .jv-clarify-head { color: color-mix(in srgb, var(--holo) 90%, #fff);
    font: 700 12px/1.3 Archivo, system-ui; letter-spacing: .14em; text-transform: uppercase; }
  .jv-clarify-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .jv-chip {
    pointer-events: auto; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--holo) 50%, transparent);
    background: color-mix(in srgb, var(--holo) 12%, transparent);
    color: color-mix(in srgb, var(--holo) 95%, #fff);
    font: 700 13px/1 Archivo, system-ui; letter-spacing: .04em;
    transition: background .12s, transform .12s; }
  .jv-chip:hover { background: color-mix(in srgb, var(--holo) 28%, transparent);
    transform: translateY(-1px); }
  .jv-chip:active { transform: translateY(0); }
</style>
</head>
<body>
  <div id="jv-clarify-root"></div>
  <div id="stage">
    <iframe id="hud" src="/hud.html" allow="microphone"></iframe>
  </div>
  <div id="jv-glow"></div>
  <div id="jv-rings"></div><!-- filled by spawnPeak() while speaking -->

  <!-- Sits over the HUD's scripted J.A.R.V.I.S. line and shows the real reply. -->
  <!-- Blank by design: masks the HUD's scripted dialogue line. The reply is
       shown in the transcript panel, never here. -->
  <div id="jv-hudline">
    <span class="jv-hl-label"></span><span class="jv-hl-text"></span>
  </div>

  <!-- Left column: the local model's real figures, over the set dressing. -->
  <div id="jv-left">
    <div class="jv-lf-label">Language Model</div>
    <div class="jv-lf-model" id="lf-model">—</div>
    <div class="jv-lf-chips">
      <span class="jv-lf-chip ok" id="lf-mode">LOCAL</span>
      <span class="jv-lf-chip" id="lf-quant">—</span>
      <span class="jv-lf-chip" id="lf-size">—</span>
    </div>
    <div class="jv-lf-row"><span class="jv-lf-k">Parameters</span><span class="jv-lf-v" id="lf-params">—</span></div>
    <div class="jv-lf-row"><span class="jv-lf-k">Context window</span><span class="jv-lf-v" id="lf-ctxwin">—</span></div>
    <div class="jv-lf-row"><span class="jv-lf-k">Turns</span><span class="jv-lf-v" id="lf-turns">—</span></div>
    <div class="jv-lf-row"><span class="jv-lf-k">History</span><span class="jv-lf-v" id="lf-hist">—</span></div>

    <div class="jv-lf-sec">Context Budget</div>
    <div class="jv-lf-bar"><i class="p" id="lf-bar-p"></i><i class="o" id="lf-bar-o"></i></div>
    <div class="jv-lf-row"><span class="jv-lf-k">Prompt</span><span class="jv-lf-v" id="lf-prompt">—</span></div>
    <div class="jv-lf-row"><span class="jv-lf-k">Output</span><span class="jv-lf-v" id="lf-output">—</span></div>
    <div class="jv-lf-row"><span class="jv-lf-k">Headroom</span><span class="jv-lf-v" id="lf-head">—</span></div>
  </div>

  <!-- Live telemetry, over the HUD's static THREAT ASSESSMENT block. -->
  <div id="jv-stats">
    <div class="jv-st-title">System Analysis</div>
    <div class="jv-st-row"><span class="jv-st-k">Brain</span><span class="jv-st-v" id="st-brain">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Answered by</span><span class="jv-st-v" id="st-backend">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Route</span><span class="jv-st-v" id="st-route">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Voice in</span><span class="jv-st-v" id="st-mic">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Link</span><span class="jv-st-v" id="st-link">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">State</span><span class="jv-st-v" id="st-state">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Wake</span><span class="jv-st-v" id="st-wake">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Speed</span><span class="jv-st-v" id="st-speed">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Turn</span><span class="jv-st-v" id="st-latency">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Context</span><span class="jv-st-v" id="st-ctx">—</span></div>
    <div class="jv-st-row"><span class="jv-st-k">Last tool</span><span class="jv-st-v" id="st-tool">—</span></div>
    <div class="jv-st-meter"><i id="st-amp"></i></div>
  </div>

  <!-- Conversation transcript, parked in the HUD's unused right column. -->
  <div id="jv-side">
    <div id="jv-side-head">Transcript</div>
    <div id="jv-side-log"></div>
  </div>

  <!-- Typed path. Lives in the WRAPPER document, never inside the HUD iframe, so
       it always owns focus and talks to the real backend over the same socket. -->
  <div id="jv-chat">
    <div id="jv-log"></div>
    <div id="jv-input-wrap">
      <input id="jv-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="SPEAK TO J.A.R.V.I.S. - TYPE, THEN PRESS ENTER" />
    </div>
  </div>

  <div id="jv-head">
    <span id="jv-dot"></span>
    <span id="jv-status">BOOTING…</span>
    <span id="jv-level"><i></i></span>
    <span id="jv-actions">
      <button id="jv-unlock" class="jv-btn">Activate audio</button>
      <button id="jv-end" class="jv-btn">End session</button>
      <button id="jv-retry" class="jv-btn">Enable mic</button>
    </span>
  </div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- config
  var WAKE_WORDS = ['jarvis', 'jarviss', 'jarvus', 'jervis', 'javis', 'jarvez', 'charvis', 'jarv'];
  var TARGET_RATE   = 16000;   // what we ship to Whisper
  var PREROLL_MS    = 900;     // audio kept before speech onset so the wake word is never clipped
  var CMD_HANG_MS   = 1000;    // silence that ends a command clip (sentences breathe; 800 clipped mid-thought)
  var CMD_MAX_MS    = 12000;   // room for a long command rather than truncating it
  var CMD_WAIT_MS   = 7000;    // no speech after wake word -> back to idle
  // Server watchdog. 45s was shorter than a real local-model turn: a ChatGPT
  // search measured 36.8s inside the tool alone, with jarvis-qwen3 generating
  // on both sides of it — 55.7s end to end. The client gave up while the server
  // was still working, so JARVIS looked like it had timed out and the answer
  // landed late. Ceiling now sits above the backend's own limits
  // (OLLAMA_TIMEOUT 180s, browser worker 150s) so the server always loses first
  // and can report a real error.
  var BUSY_TIMEOUT  = 190000;
  var MIN_CLIP_MS   = 350;     // ignore coughs/clicks

  // ---- VAD (AnalyserNode, adaptive noise floor) -------------------------
  // The backend is only ever consulted for a clip that this VAD called speech,
  // so room tone never reaches Whisper and JARVIS is not "constantly checking".
  var VAD_FFT       = 1024;
  var VAD_TICK_MS   = 50;      // analyser poll period
  var SPEECH_MARGIN = 1.8;     // speech = rms > noiseFloor * margin
  var SPEECH_MIN_MS = 150;     // ...sustained this long before it counts
  var FLOOR_ALPHA   = 0.05;    // slow EMA of rms during silence
  var WARM_ALPHA    = 0.30;    // faster convergence during the boot calibration
  var FLOOR_MIN     = 0.0015;  // clamps: a dead-silent room must not make the
  // FLOOR_MAX was 0.0600, which let a noisy room drive the speech threshold to
  // 0.0600*1.8 = 0.108 RMS — louder than ordinary speaking, so JARVIS went deaf
  // exactly when the room got busy. Capping the floor at 0.0300 holds the
  // threshold at 0.054 and keeps normal speech above it.
  var FLOOR_MAX     = 0.0300;  // threshold collapse, a loud one must not deafen us
  var ABS_MIN_RMS   = 0.0060;  // absolute gate under the adaptive one
  var CALIBRATE_MS  = 1800;

  // ---------------------------------------------------------------- dom
  var glow = document.getElementById('jv-glow');
  var ringsEl = document.getElementById('jv-rings');
  var dot = document.getElementById('jv-dot');
  var statusEl = document.getElementById('jv-status');
  var levelEl = document.querySelector('#jv-level i');
  var retryBtn = document.getElementById('jv-retry');
  var unlockBtn = document.getElementById('jv-unlock');
  var endBtn = document.getElementById('jv-end');
  var hud = document.getElementById('hud');
  // Transcript now renders in the HUD's right column; #jv-log is kept in the
  // DOM (hidden) so nothing that references it breaks.
  var chatLog = document.getElementById('jv-side-log')
               || document.getElementById('jv-log');
  var chatInput = document.getElementById('jv-input');
  var chatWrap = document.getElementById('jv-input-wrap');
  var rootStyle = document.documentElement.style;
  var PLACEHOLDER = 'SPEAK TO J.A.R.V.I.S. - TYPE, THEN PRESS ENTER';

  // ---------------------------------------------------------------- hud link
  // The HUD artifact re-sets `--spd` on ITS OWN documentElement on every render,
  // so writing it once is not enough: we keep re-applying the target from here.
  var HUD_SPD = { idle: 1, listening: 1.7, transcribing: 1.2, thinking: 1.2, speaking: 2.4 };
  var hudSpd = 1;

  function applyHudSpeed() {
    try {
      var d = hud.contentDocument || (hud.contentWindow && hud.contentWindow.document);
      if (d && d.documentElement) d.documentElement.style.setProperty('--spd', String(hudSpd));
    } catch (e) {}          // not loaded yet, or (never, here) cross-origin
  }
  function setHudSpeed(v) {
    hudSpd = v;
    rootStyle.setProperty('--spd', String(v));   // wrapper-level cues
    applyHudSpeed();
  }
  setInterval(applyHudSpeed, 200);
  hud.addEventListener('load', applyHudSpeed);

  // ---------------------------------------------------------------- ui
  // 'listening' = the command window is open and JARVIS is capturing the command.
  var uiState = 'idle';

  function setState(st, txt) {
    uiState = st;
    setHudSpeed(HUD_SPD[st] || 1);
    hud.className = (st === 'speaking' || st === 'listening') ? st : '';
    glow.className = st === 'speaking' ? 'speak'
      : st === 'listening' ? 'listen'
      : (st === 'thinking' || st === 'transcribing') ? 'think' : '';
    ringsEl.className = st === 'speaking' ? 'speak' : '';   // orb rings, speech only
    dot.className = st === 'speaking' ? 'speak'
      : st === 'listening' ? 'listen'
      : (st === 'thinking' || st === 'transcribing') ? 'think' : '';
    if (txt) statusEl.textContent = txt;
    statusEl.className = (st === 'listening' || st === 'speaking') ? 'live' : '';
    // The HUD artifact is read-only; it ignores this, but forward anyway so a
    // future HUD build can react without touching hud_artifact.html.
    try { hud.contentWindow.postMessage({ source: 'jarvis', type: 'state', state: st }, '*'); } catch (e) {}
  }
  function setDead(txt) { dot.className = 'dead'; glow.className = ''; hud.className = '';
    ringsEl.className = ''; statusEl.className = ''; statusEl.textContent = txt; setHudSpeed(1); }
  // There is no transcript panel any more. Conversation text goes to the
  // console; only one-off failures get a moment on the status strip.
  function notice(txt) { console.warn('[jarvis] ' + txt); statusEl.textContent = txt; }

  // Layer 1 (Intake) "did you mean?" surface. Renders the mis-heard text plus
  // tappable correction chips. Tapping a chip re-sends that candidate as a
  // clean typed command so the user fixes a bad hear with one click, never a
  // re-record. Auto-dismisses when the next real message arrives.
  var clarifyEl = null;
  function showClarify(heard, echo, candidates) {
    hideClarify();
    if (!candidates.length) { notice(echo || 'Say that again?'); return; }
    clarifyEl = document.createElement('div');
    clarifyEl.className = 'jv-clarify';
    var h = document.createElement('div');
    h.className = 'jv-clarify-head';
    h.textContent = echo || 'Did you mean?';
    clarifyEl.appendChild(h);
    var row = document.createElement('div');
    row.className = 'jv-clarify-chips';
    candidates.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'jv-chip';
      b.type = 'button';
      b.textContent = c;
      b.addEventListener('click', function () {
        hideClarify();
        if (send({ type: 'text', text: c, speak: true })) {
          logConv('user', c);
          pendingReply = true;
          mode = 'busy'; busySince = Date.now();
          setState('thinking', 'THINKING…');
        }
      });
      row.appendChild(b);
    });
    clarifyEl.appendChild(row);
    var root = document.getElementById('jv-clarify-root') || document.body;
    root.appendChild(clarifyEl);
    // float it over the HUD for a few seconds, then fade
    setTimeout(hideClarify, 9000);
  }
  function hideClarify() {
    if (clarifyEl && clarifyEl.parentNode) clarifyEl.parentNode.removeChild(clarifyEl);
    clarifyEl = null;
  }

  // ---------------------------------------------------------------- chat log
  // Terminal transcript. User lines land instantly; JARVIS lines are revealed
  // letter-by-letter and only THEN hand their TTS clip to speak(), so the typing
  // and the voice land together. One reveal at a time: a new response cancels
  // whatever is still typing (its queued audio dies with it — no overlap).
  var TYPE_MS = 30;             // per tick
  var TYPE_MAX_TICKS = 200;     // long replies reveal >1 char/tick so the wait
                                // before speech stays ~6s instead of unbounded
  var twTimer = 0, twSpan = null, twLine = null, twAudio = null;

  // ---------------------------------------------------------------- hud line
  // The HUD owns a scripted J.A.R.V.I.S. line that it retypes from its own
  // timers ("THE SCAN IS ARCHIVED TO THE MALIBU SERVER, SIR."), re-rendering
  // that subtree as it goes. Writing the real reply into it loses that race —
  // and observing the node fails too, because React replaces the element and
  // the observer is left watching a detached parent. So the reply is drawn in
  // a wrapper-owned overlay parked on top of the HUD line instead.
  var hudLineEl  = document.getElementById('jv-hudline');
  var hudTextEl  = hudLineEl ? hudLineEl.querySelector('.jv-hl-text') : null;
  var JARVIS_LABEL = /J\.A\.R\.V\.I\.S\.\s*\/\//;

  // Of the eight span.sc-interp nodes the HUD renders (energy readout, scan
  // percent, the VOICE toggle...), the speech line is the only one whose parent
  // carries the "J.A.R.V.I.S. //" label. Position, not text, is what we want.
  function hudLineBox() {
    try {
      var d = hud.contentDocument || (hud.contentWindow && hud.contentWindow.document);
      if (!d) return null;
      var all = d.querySelectorAll('span.sc-interp');
      for (var i = 0; i < all.length; i++) {
        var par = all[i].parentElement;
        if (par && JARVIS_LABEL.test(par.textContent || '')) return par;
      }
      return null;
    } catch (e) { return null; }   // iframe not ready
  }

  function positionHudLine() {
    if (!hudLineEl || !hudLineEl.classList.contains('show')) return;
    var box = hudLineBox();
    if (!box) return;
    var r = box.getBoundingClientRect();
    var f = hud.getBoundingClientRect();
    hudLineEl.style.left   = (f.left + r.left) + 'px';
    hudLineEl.style.top    = (f.top + r.top) + 'px';
    hudLineEl.style.width  = r.width + 'px';
    hudLineEl.style.height = r.height + 'px';
  }

  // The reply no longer appears under the orb — it lives only in the transcript
  // panel. This overlay stays, blank, purely as a mask: remove it and the HUD's
  // own scripted dialogue ("GOOD EVENING, SIR. ARCHIVE CRATE 07 IS ON THE
  // PLATFORM") shows through again, which is worse than nothing since it is
  // fake text that looks like JARVIS speaking.
  function hudSay(text, typing) {
    if (!hudLineEl) return false;
    if (hudTextEl) hudTextEl.textContent = '';
    var lbl = hudLineEl.querySelector('.jv-hl-label');
    if (lbl) lbl.textContent = '';
    hudLineEl.classList.add('show');
    hudLineEl.classList.remove('jv-typing');
    positionHudLine();
    return true;
  }

  // ------------------------------------------------------------- side panel
  // The HUD's right column ends after the PROTOCOL row and leaves the rest of
  // the aside empty (measured 310x505 with zero elements in it). Anchor to the
  // bottom of that column's real content rather than to fixed pixels, so the
  // panel keeps its place if the HUD reflows at another window size.
  var sideEl = document.getElementById('jv-side');

  // The HUD's right column. Found by the text it contains, not by index, so it
  // survives the artifact reordering its own markup.
  function hudAside() {
    try {
      var d = hud.contentDocument || (hud.contentWindow && hud.contentWindow.document);
      if (!d) return null;
      var asides = d.querySelectorAll('aside');
      for (var i = 0; i < asides.length; i++) {
        if (/THREAT ASSESSMENT/i.test(asides[i].textContent || '')) return asides[i];
      }
      return null;
    } catch (e) { return null; }
  }

  function hudRightBand() {
    try {
      var aside = hudAside();
      if (!aside) return null;
      var ar = aside.getBoundingClientRect();
      var bottom = ar.top, kids = aside.querySelectorAll('*');
      for (var j = 0; j < kids.length; j++) {
        if (kids[j].children.length) continue;
        if (!(kids[j].textContent || '').trim()) continue;
        var kr = kids[j].getBoundingClientRect();
        if (kr.height > 0 && kr.bottom > bottom) bottom = kr.bottom;
      }
      var top = bottom + 16, height = ar.bottom - top - 12;
      if (height < 90) return null;          // no usable room at this size
      return { left: ar.left + 10, top: top, width: ar.width - 20, height: height };
    } catch (e) { return null; }
  }

  function positionSidePanel() {
    if (!sideEl) return;
    var band = hudRightBand();
    if (!band) { sideEl.classList.remove('show'); return; }
    var f = hud.getBoundingClientRect();
    // Start below the telemetry panel, whose height depends on how many rows
    // have data. Clamping it the other way round is what caused the overlap.
    var top = f.top + band.top;
    var sb = statsBottom();
    if (sb !== null && sb + 10 > top) top = sb + 10;
    var bottom = f.top + band.top + band.height;
    var height = bottom - top;
    if (height < 80) { sideEl.classList.remove('show'); return; }
    sideEl.style.left   = (f.left + band.left) + 'px';
    sideEl.style.top    = top + 'px';
    sideEl.style.width  = band.width + 'px';
    sideEl.style.height = height + 'px';
    sideEl.classList.add('show');
  }

  // ---------------------------------------------------------------- telemetry
  // Phase 1: only signals that already exist client-side or on /status. Nothing
  // here is invented — a panel that lies is worse than one that is obviously
  // decorative, which is the whole point of replacing the fake THREAT
  // ASSESSMENT block.
  var statsEl = document.getElementById('jv-stats');
  var stBrain = document.getElementById('st-brain');
  var stBackend = document.getElementById('st-backend');
  var stRoute = document.getElementById('st-route');
  var stMic = document.getElementById('st-mic');
  var stLink = document.getElementById('st-link');
  var stState = document.getElementById('st-state');
  var stWake = document.getElementById('st-wake');
  var stAmp = document.getElementById('st-amp');

  function setVal(el, text, cls) {
    if (!el) return;
    el.textContent = text;
    el.className = 'jv-st-v' + (cls ? ' ' + cls : '');
  }

  // Covers the static rows only: from the THREAT ASSESSMENT label down to the
  // bottom of the column's real content (the PROTOCOL row). The transcript
  // panel already owns everything below that.
  function positionStats() {
    if (!statsEl) return;
    var aside = hudAside();
    if (!aside) { statsEl.classList.remove('show'); return; }
    var label = null, kids = aside.querySelectorAll('*');
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].children.length) continue;
      if (/THREAT ASSESSMENT/i.test(kids[i].textContent || '')) { label = kids[i]; break; }
    }
    var band = hudRightBand();
    if (!label || !band) { statsEl.classList.remove('show'); return; }
    var lr = label.getBoundingClientRect(), ar = aside.getBoundingClientRect();
    var f = hud.getBoundingClientRect();
    // Height is NOT clamped to the gap above the transcript: the panel grew when
    // the telemetry rows were added and simply overflowed, drawing on top of the
    // transcript. It sizes to its own content instead, and the transcript starts
    // below whatever height that turns out to be.
    statsEl.style.left   = (f.left + ar.left + 10) + 'px';
    statsEl.style.top    = (f.top + lr.top - 8) + 'px';
    statsEl.style.width  = (ar.width - 20) + 'px';
    statsEl.style.height = 'auto';
    statsEl.classList.add('show');
  }

  function statsBottom() {
    if (!statsEl || !statsEl.classList.contains('show')) return null;
    var r = statsEl.getBoundingClientRect();
    return r.height ? r.bottom : null;
  }

  var stSpeed = document.getElementById('st-speed');
  var stLatency = document.getElementById('st-latency');
  var stCtx = document.getElementById('st-ctx');
  var stTool = document.getElementById('st-tool');

  // Server telemetry, one message per turn. Absent fields stay blank on purpose:
  // a HUD that pads with plausible numbers is the fake panel we just replaced.
  function applyTelemetry(s) {
    if (!s) return;
    setVal(stSpeed, s.tok_per_sec ? s.tok_per_sec + ' tok/s' : '—');
    if (s.latency_ms) {
      var secs = (s.latency_ms / 1000).toFixed(1) + 's';
      setVal(stLatency, s.p50_ms ? secs + '  (p50 ' + (s.p50_ms / 1000).toFixed(1) + 's)' : secs,
             s.latency_ms > 20000 ? 'warn' : '');
    }
    if (s.prompt_tokens) {
      var used = s.prompt_tokens + (s.eval_tokens || 0);
      var pct = s.context_limit ? Math.round(used / s.context_limit * 100) : null;
      setVal(stCtx, s.context_limit
        ? used.toLocaleString() + ' / ' + s.context_limit.toLocaleString() + ' (' + pct + '%)'
        : used.toLocaleString() + ' tok',
        pct !== null && pct > 80 ? 'bad' : (pct !== null && pct > 60 ? 'warn' : ''));
    }
    var tools = s.tools || [];
    setVal(stTool, tools.length
      ? tools[tools.length - 1].name + ' (' + (tools[tools.length - 1].ms / 1000).toFixed(1) + 's)'
      : 'none this turn');
  }

  // ------------------------------------------------------------- left column
  // The HUD's left OBJECT ANALYSIS aside was deleted (2026-08-08), so the panel
  // now anchors to the center <main> visualization instead. It sits in the
  // top-left interior of <main> and sizes to its own content (height:auto).
  var leftEl = document.getElementById('jv-left');

  function hudLeftAside() {
    try {
      var d = hud.contentDocument || (hud.contentWindow && hud.contentWindow.document);
      if (!d) return null;
      var m = d.querySelector('main');
      if (!m) return null;
      var r = m.getBoundingClientRect();
      if (r.width < 80 || r.height < 80) return null;
      return m;
    } catch (e) { return null; }
  }

  function positionLeft() {
    if (!leftEl) return;
    var box = hudLeftAside();
    if (!box) { leftEl.classList.remove('show'); return; }
    var r = box.getBoundingClientRect(), f = hud.getBoundingClientRect();
    // Anchor inside the top-left corner of <main>; size to content.
    var top = r.top + 16;
    if (r.height < 200) { leftEl.classList.remove('show'); return; }
    var w = Math.min(r.width * 0.5, 300) - 24;
    if (w < 160) w = 160;
    leftEl.style.left   = (f.left + r.left + 16) + 'px';
    leftEl.style.top    = (f.top + top) + 'px';
    leftEl.style.width  = w + 'px';
    leftEl.style.height = 'auto';
    leftEl.classList.add('show');
  }

  function applyLeft(s) {
    if (!s) return;
    var meta = s.model_meta || {};
    var set = function (id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
    set('lf-model', (s.model || '—').toUpperCase());
    set('lf-mode', s.local_only ? 'LOCAL ONLY' : 'LOCAL FIRST');
    set('lf-quant', meta.quant || '—');
    set('lf-size', meta.size_gb ? meta.size_gb + ' GB' : '—');
    set('lf-params', meta.params || '—');
    set('lf-ctxwin', s.context_limit ? s.context_limit.toLocaleString() + ' tok' : '—');
    set('lf-turns', s.turns != null ? String(s.turns) : '—');
    set('lf-hist', s.history_msgs != null ? s.history_msgs + ' msgs' : '—');

    var lim = s.context_limit, pt = s.prompt_tokens || 0, ot = s.eval_tokens || 0;
    if (lim) {
      var pp = Math.min(100, pt / lim * 100), op = Math.min(100 - pp, ot / lim * 100);
      var bp = document.getElementById('lf-bar-p'), bo = document.getElementById('lf-bar-o');
      if (bp) bp.style.width = pp + '%';
      if (bo) bo.style.width = op + '%';
      set('lf-prompt', pt.toLocaleString() + ' (' + Math.round(pp) + '%)');
      set('lf-output', ot.toLocaleString() + ' (' + Math.round(op) + '%)');
      var head = Math.max(0, lim - pt - ot);
      set('lf-head', head.toLocaleString() + ' (' + Math.round(head / lim * 100) + '%)');
    }
  }

  var STATE_LABEL = { idle: 'Idle', scan: 'Wake word', command: 'Listening',
                      busy: 'Working', speaking: 'Speaking', nomic: 'No mic', boot: 'Calibrating' };

  function refreshLocalStats() {
    setVal(stLink, ws && ws.readyState === 1 ? 'Stable' : 'Reconnecting',
           ws && ws.readyState === 1 ? 'ok' : 'bad');
    setVal(stMic, micOk ? 'Live' : 'Blocked', micOk ? 'ok' : 'bad');
    setVal(stState, STATE_LABEL[mode] || mode || '—');
    if (stAmp) stAmp.style.width = Math.min(100, lastLevel * 900) + '%';
  }

  function refreshServerStats() {
    // Same endpoint the status bar already exposes; no new server work.
    fetch('/status', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (s) {
        setVal(stBrain, s.brain || '—');
        var b = s.last_backend;
        setVal(stBackend, b ? b : 'awaiting first turn',
               b === 'mock' ? 'bad' : (b === 'ollama' ? 'ok' : (b ? 'warn' : '')));
        // Route comes from the server's live flags now. It was hardcoded, so it
        // kept advertising groq/cerebras/gemini after local-only disabled them.
        setVal(stRoute, s.route || '—', s.local_only ? 'ok' : '');
        // Server-side wake fallback health: tells you at a glance whether the
        // music-proof listener is alive (so deafness over music is diagnosable).
        var wk = s.wake_server || {};
        if (wk.healthy) setVal(stWake, 'Server live', 'ok');
        else if (wk.error) setVal(stWake, 'Server off: ' + wk.error, 'warn');
        else setVal(stWake, 'Server off', 'warn');
      })
      .catch(function () { setVal(stBrain, 'unreachable', 'bad'); });
  }

  window.addEventListener('resize', function () {
    positionHudLine(); positionLeft(); positionStats(); positionSidePanel();
  });
  // One pass for every overlay: separate timers would each cost a layout read
  // against the iframe.
  setInterval(function () {
    positionHudLine(); positionLeft(); positionStats(); positionSidePanel(); refreshLocalStats();
  }, 1000);
  setInterval(refreshServerStats, 3000);
  positionLeft(); positionStats(); positionSidePanel(); refreshLocalStats(); refreshServerStats();
  // Mask the HUD's scripted line from the first frame, not only once a reply
  // arrives — otherwise its canned dialogue is on screen until then.
  hudSay('');
  setTimeout(function () { hudSay(''); }, 2500);   // iframe may still be loading

  function cancelTypewriter() {
    if (twTimer) { clearTimeout(twTimer); twTimer = 0; }
    if (twSpan && twLine) {                     // leave the text fully revealed
      var whole = twSpan.getAttribute('data-full') || twSpan.textContent;
      twSpan.textContent = whole;
      hudSay(whole, false);                     // HUD must not keep a half line
      twLine.classList.remove('jv-typing');
    }
    twSpan = null; twLine = null; twAudio = null;
  }

  // Spoken session cue. Asks the server to TTS a short line so JARVIS audibly
  // signals a state change (e.g. "what is it, sir?" on wake, "standing by" on
  // close). The server replies with {type:'cue', audio}; we play it immediately.
  function cue(text) {
    send({ type: 'cue', text: text });
  }

  function logConv(role, text, audio) {
    if (!chatLog) return;
    var line = document.createElement('div');
    line.className = 'jv-line jv-line-' + role;
    var span = document.createElement('span');
    span.className = 'jv-text';
    line.appendChild(span);
    chatLog.appendChild(line);

    var full = String(text == null ? '' : text);
    if (role !== 'jarvis') {                    // user: immediate, right-aligned
      span.textContent = full;
      chatLog.scrollTop = chatLog.scrollHeight;
      return;
    }

    // Reply lands whole, no character-by-character reveal. The typewriter used
    // to gate playback — speech only started once the last character had been
    // drawn, which cost up to 6s of silence on a long answer (TYPE_MAX_TICKS 200
    // x TYPE_MS 30). Showing the text at once and speaking immediately removes
    // that delay entirely; the audio release below is the same call the reveal
    // used to make at its end.
    cancelTypewriter();                         // clear any in-flight reveal
    span.setAttribute('data-full', full);
    span.textContent = full;
    hudSay(full, false);
    chatLog.scrollTop = chatLog.scrollHeight;
    if (audio) speak(audio); else if (mode !== 'speaking') goIdle();
  }

  // ---------------------------------------------------------------- chat input
  // Slash commands are handled here, never sent as a prompt: on the local model
  // a turn costs seconds, and the model would try to *answer* "/clear" rather
  // than clear anything.
  function runCommand(name) {
    if (!send({ type: 'command', name: name })) {
      notice('NOT CONNECTED — COMMAND NOT SENT');
      return true;
    }
    if (name === 'clear') {
      cancelTypewriter();
      if (chatLog) chatLog.innerHTML = '';        // wipe the visible transcript too
      hudSay('');
      setVal(stBackend, 'awaiting first turn');
      ['st-speed', 'st-latency', 'st-ctx', 'st-tool'].forEach(function (id) {
        var e = document.getElementById(id);
        if (e) { e.textContent = '—'; e.className = 'jv-st-v'; }
      });
      ['lf-turns', 'lf-hist', 'lf-prompt', 'lf-output', 'lf-head'].forEach(function (id) {
        var e = document.getElementById(id); if (e) e.textContent = '—';
      });
      var bp = document.getElementById('lf-bar-p'), bo = document.getElementById('lf-bar-o');
      if (bp) bp.style.width = '0%';
      if (bo) bo.style.width = '0%';
    }
    chatInput.value = '';
    chatInput.focus();
    return true;
  }

  function sendTyped() {
    var value = chatInput.value.trim();
    if (!value) return;
    if (value.charAt(0) === '/') {
      var cmd = value.slice(1).trim().toLowerCase();
      if (cmd === 'clear' || cmd === 'reset') { runCommand('clear'); return; }
      notice('UNKNOWN COMMAND: ' + value);
      chatInput.value = '';
      return;
    }
    if (!send({ type: 'text', text: value, speak: true })) {
      // WS down: keep the typed text, say so, log nothing as a reply.
      notice('NOT CONNECTED — MESSAGE NOT SENT');
      chatWrap.classList.add('jv-err');
      setTimeout(function () { chatWrap.classList.remove('jv-err'); }, 1200);
      chatInput.focus();
      return;
    }
    logConv('user', value);
    chatInput.value = '';
    chatInput.placeholder = '> ';
    setTimeout(function () { chatInput.placeholder = PLACEHOLDER; }, 900);
    chatInput.focus();                          // typing stays the active path
    pendingReply = true;
    mode = 'busy'; busySince = Date.now();      // mic stays deaf until the reply lands
    setState('thinking', 'THINKING…');
  }

  var pendingReply = false;
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); sendTyped(); }
  });

  // ---------------------------------------------------------------- websocket
  var ws = null, wsReady = false, reconnectDelay = 800;

  var pingInterval = null;
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');
    ws.onopen = function () {
      wsReady = true; reconnectDelay = 800;
      if (pingInterval) clearInterval(pingInterval);
      pingInterval = setInterval(function () {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'ping'}));
      }, 15000);
      if (mode === 'boot') return;
      goIdle();
    };
    ws.onclose = function () {
      wsReady = false;
      if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
      setDead('DISCONNECTED — RETRYING…');
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 8000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
    ws.onmessage = onMessage;
  }

    if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; }
    return false;

  function onMessage(ev) {
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }

    // Any word from the server means the turn is alive, so the watchdog measures
    // silence rather than total elapsed time. A slow-but-progressing turn
    // (transcribing -> thinking -> speaking) no longer trips it.
    if (mode === 'busy') busySince = Date.now();

    if (m.type === 'telemetry') {
      applyTelemetry(m.stats);
      applyLeft(m.stats);
      return;
    }

    // Server-side wake-word fallback fired (music-proof). Open the command window
    // exactly as the browser WakeListener would, guarded by a short lock so the two
    // engines can't both open a capture for one "jarvis".
    if (m.type === 'wake') {
      var src = (m.source === 'server') ? 'SERVER' : 'BROWSER';
      console.log('[wake] ' + src + ' engine detected wake word');
      var now = Date.now();
      if (now - lastWakeAt < 2000) return;   // de-dupe against the browser listener
      lastWakeAt = now;
      // Open the voice session when resting (off after a reply, or idle from
      // enable-mic). Must match mode==='off' because goIdle() parks there.
      if (mode === 'off' || mode === 'idle') {
        console.log('[session] wake — opening voice session');
        beginCapture('command', false);
        cue('What is it, sir?');
      }
      return;
    }

    if (m.type === 'cleared') {
      pendingReply = false;
      notice(m.text || 'CONTEXT CLEARED');
      if (mode !== 'speaking') goIdle();
      return;
    }

    // Server-synthesized session cue (wake / close). Just play it.
    if (m.type === 'cue') {
      if (m.audio) { speak(m.audio); }
      else if (m.text) { notice(m.text); }
      return;
    }

    // Layer 1 (Intake) confirmation gate: a low-confidence / mis-heard command
    // becomes a set of tappable correction chips instead of a wrong action.
    // Tapping a chip re-sends that candidate as a fresh (now clean) command.
    if (m.type === 'clarify') {
      console.log('[clarify] heard=' + m.heard + ' echo=' + m.echo +
                  ' candidates=' + JSON.stringify(m.candidates));
      showClarify(m.heard, m.echo, m.candidates || []);
      return;
    }

    if (m.type === 'transcript') {
      console.log('[you] ' + m.text);
      // Session boundary rules (Phase 1 UX + spurious-close fix):
      //   * Bare "jarvis" OPENS the mic when truly off (speaks a listening cue).
      //   * Bare "jarvis" must NEVER CLOSE the session: Whisper routinely
      //     appends "jarvis" to real commands, so a stray/trailing "jarvis"
      //     would end the chat even when you never meant to. That was the
      //     bug that killed the mic mid-conversation.
      //   * CLOSE happens only on an EXPLICIT close phrase ("exit jarvis",
      //     "stop jarvis", "bye jarvis", "that's all") — words Whisper does
      //     not spontaneously emit for a normal command.
      var youText = (m.text || '').trim();
      var youLower = youText.toLowerCase().replace(/[.,!?;:]+$/g, '').trim();
      // A bare wake word (and nothing else) — used ONLY to open.
      var isBareWake = /^(hey\s+|ok\s+|okay\s+|hi\s+)?(jarvis\w*)(\s+(jarvis\w*))*$/i.test(youLower);
      // Explicit close: a close verb LEADING, optionally followed by the wake
      // word. The verb must lead so a command merely ending in "jarvis" is safe.
      var isCloseIntent = /^(stop|end|close|exit|quit|that'?s all|that is all|done|finish|bye|goodbye)(\s+(jarvis\w*))?$/i.test(youLower);
      if (mode === 'off' && isBareWake) {
        // Open the voice session and audibly signal listening.
        console.log('[session] wake — opening voice session');
        beginCapture('command', false);
        cue('What is it, sir?');
        return;
      }
      if (isCloseIntent) {
        // Deliberate end phrase: close the session with a standing-by cue.
        sessionClosePending = true;
        console.log('[session] close requested — mic will stop after reply');
        if (mode !== 'busy' && mode !== 'speaking') {
          stopMic();
          mode = 'off';
          cue('Standing by, sir.');
          setState('idle', 'VOICE SESSION ENDED — SAY "JARVIS" TO RESUME');
          dot.className = 'dead';
          if (endBtn) endBtn.classList.remove('show');
          return;
        }
      }
      setState('thinking', 'THINKING…');
    } else if (m.type === 'response') {
      console.log('[jarvis] ' + m.text);
      pendingReply = false;
      if (m.text) {
        // The typewriter owns the audio now: it calls speak() the moment the
        // last character lands (or goIdle() when the reply carries no clip).
        logConv('jarvis', m.text, m.audio);
      } else if (m.audio) {
        speak(m.audio);                         // audio with no text: just talk
      } else {
        goIdle();
      }
    } else if (m.type === 'progress') {
      // Mid-task status update: show text in chat AND speak it.
      if (m.text) {
        logConv('jarvis', m.text, m.audio);
      } else if (m.audio) {
        speak(m.audio);
      }
    } else if (m.type === 'status') {
      if (m.state === 'idle') {
        // Never let the server yank us out of playback; goIdle() runs when TTS ends.
        if (mode !== 'speaking') goIdle();
      } else if (m.state === 'transcribing') {
        if (mode === 'busy') setState('transcribing', 'TRANSCRIBING…');
      } else if (m.state === 'thinking') {
        if (mode === 'busy') setState('thinking', 'THINKING…');
      }
    } else if (m.type === 'error') {
      goIdle();
      notice('ERROR — ' + m.text);
    }
  }

  // ------------------------------------------------- speech-reactive visuals
  // A second, playback-only AudioContext taps the TTS <audio> element and turns
  // its live waveform into the CSS levers declared in :root. It is completely
  // separate from the mic graph below (that one gets closed on every teardown).
  // Everything here is best-effort: if Web Audio is unavailable or the element
  // cannot be tapped, we fall back to a timed oscillation and nothing throws.
  var AMP_FFT      = 512;
  var AMP_SMOOTH   = 0.6;
  var AMP_GAIN     = 3.2;    // raw RMS of speech sits around .05–.30 -> normalise
  var PEAK_DECAY   = 0.90;   // per-frame decay of the held peak
  var PEAK_TRIGGER = 0.42;   // rms must cross this (from below) to launch a ring

  var ampBuf = null, ampEl = null, ampDead = false;

  var lastRMS = 0, peakRMS = 0, wasOverPeak = false;

    // rms/peak are already normalised to 0..1.
    rootStyle.setProperty('--amp', rms.toFixed(3));
    rootStyle.setProperty('--hue', (Math.sin(peakRMS * 6.0) * 12 * rms).toFixed(2) + 'deg');
    rootStyle.setProperty('--bright', (1 + 0.25 * rms).toFixed(3));
    rootStyle.setProperty('--sat', (1 + 0.40 * rms).toFixed(3));
    rootStyle.setProperty('--glow', (0.40 + 0.60 * peak).toFixed(3));
    rootStyle.setProperty('--glow-r', (48 + 40 * rms).toFixed(1) + 'vmin');
    // The HUD's own React frame loop consumes --spd, so this really does speed
    // up the inner blob's bands/chords/dust on loud phonemes.
    setHudSpeed(2.4 + 1.6 * rms);
  }

  function resetAmpVars() {
    rootStyle.setProperty('--amp', '0');
    rootStyle.setProperty('--hue', '0deg');
    rootStyle.setProperty('--bright', '1');
    rootStyle.setProperty('--sat', '1');
    rootStyle.setProperty('--glow', '0');
    rootStyle.setProperty('--glow-r', '48vmin');
    lastRMS = 0; peakRMS = 0; wasOverPeak = false;
  }

  function detachAnalyser() {

    // gets its own node set and the previous one is unhooked here. Never leak.
    try { if (ampSrc) ampSrc.disconnect(); } catch (e) {}
    try { if (ampAnalyser) ampAnalyser.disconnect(); } catch (e) {}
    try { if (ampGain) ampGain.disconnect(); } catch (e) {}
    ampSrc = ampAnalyser = ampGain = null; ampBuf = null; ampEl = null;
  }

    if (ampEl === el && ampAnalyser) return true;      // already analysing it
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { ampDead = true; return false; }
    detachAnalyser();
    try {
      if (!ampCtx) ampCtx = new AC();
      ampSrc = ampCtx.createMediaElementSource(el);
      ampAnalyser = ampCtx.createAnalyser();
      ampAnalyser.fftSize = AMP_FFT;
      ampAnalyser.smoothingTimeConstant = AMP_SMOOTH;
      // Routing the element through the graph makes the graph its ONLY output,
      // so this gain stays at unity — JARVIS must still be audible. (The muted
      // sink pattern belongs to the mic path, where nothing may reach speakers.)
      ampGain = ampCtx.createGain(); ampGain.gain.value = 1;
      ampSrc.connect(ampAnalyser); ampAnalyser.connect(ampGain);
      ampGain.connect(ampCtx.destination);

      ampEl = el;
    } catch (e) {
      detachAnalyser();
      ampDead = true;                                   // don't retry every clip
      return false;
    }
    try { if (ampCtx.state === 'suspended') ampCtx.resume(); } catch (e) {}

  }

    if (!ampAnalyser) return 0;

    for (i = 0; i < ampBuf.length; i++) { s = (ampBuf[i] - 128) / 128; sum += s * s; }
    return Math.min(1, Math.sqrt(sum / ampBuf.length) * AMP_GAIN);
  }

  function spawnPeak(rms) {
    if (!ringsEl || ringsEl.childElementCount >= MAX_RINGS) return;
    var el = document.createElement('i');
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    el.addEventListener('animationend', function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    ringsEl.appendChild(el);
    el.className = 'jv-ring-spawn';
  }

  function speakLoop() {
    if (mode !== 'speaking') { stopSpeakLoop(); return; }
    rafId = requestAnimationFrame(speakLoop);
    var rms = readAmp();
    peakRMS = Math.max(rms, peakRMS * PEAK_DECAY);
    ampVars(rms, peakRMS);
    if (rms >= PEAK_TRIGGER && !wasOverPeak) spawnPeak(rms);
    wasOverPeak = rms >= PEAK_TRIGGER;
    lastRMS = rms;
  }

  // No analyser (no Web Audio, tainted element, blocked context): keep the orb
  // alive with a slow synthetic swell so the speaking state still reads as speech.
  function fallbackLoop() {
    if (mode !== 'speaking') { stopSpeakLoop(); return; }
    var t = (Date.now() - fallbackT0) / 1000;
    var rms = 0.25 + 0.25 * (0.5 + 0.5 * Math.sin(t * 3.4));
    peakRMS = Math.max(rms, peakRMS * PEAK_DECAY);
    ampVars(rms, peakRMS);
    if (rms >= PEAK_TRIGGER && !wasOverPeak) spawnPeak(rms);
    wasOverPeak = rms >= PEAK_TRIGGER;
  }

  function startSpeechVisuals(el) {
    stopSpeakLoop();
    if (attachAnalyser(el)) {
      rafId = requestAnimationFrame(speakLoop);
    } else {
      fallbackT0 = Date.now();
      fallbackTimer = setInterval(fallbackLoop, 60);
    }
  }

  function stopSpeakLoop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = 0; }
    detachAnalyser();
    resetAmpVars();
    setHudSpeed(HUD_SPD.idle);
  }

  // ---------------------------------------------------------------- audio out
  var current = null, audioUnlocked = false;

  function speak(b64) {
    mode = 'speaking';
    if (current) { try { current.pause(); } catch (e) {} }
    stopSpeakLoop();                       // never double-analyse two clips
    setState('speaking', 'SPEAKING…');
    var a = new Audio('data:audio/mp3;base64,' + b64);
    current = a;
    a.onended = a.onerror = function () {
      if (current === a) current = null;
      stopSpeakLoop();
      goIdle();
    };
    a.play().then(function () {
              audioUnlocked = true; unlockBtn.classList.remove('show');
              startSpeechVisuals(a);       // playback has actually begun
            })
            .catch(function () { unlockBtn.classList.add('show'); stopSpeakLoop(); goIdle(); });
  }

  // ---------------------------------------------------------------- wav encode
  function resample(input, from, to) {
    if (from === to) return input;
    var ratio = from / to, n = Math.max(1, Math.round(input.length / ratio));
    var out = new Float32Array(n);

      out[i] = input[i0] * (1 - f) + input[i1] * f;

    var buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf), i;
    function str(off, s) { for (var k = 0; k < s.length; k++) v.setUint8(off + k, s.charCodeAt(k)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, TARGET_RATE, true); v.setUint32(28, TARGET_RATE * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, pcm.length * 2, true);

    for (var i = 0; i < bytes.length; i += cs) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + cs));
    return btoa(bin);

  // ---------------------------------------------------------------- wake listener
  // Always-on wake-word detection. Replaces the old VAD-triggered "scan": instead
  // of opening a Whisper transcription on any loud sound, we run a continuous
  // cloud-backed speech recognizer whose ONLY job is to detect the wake word.
  // Ambient noise / chatter never reaches Whisper or the brain — only a recognized
  // "jarvis" (or a fuzzy variant) opens the command window. The actual command is
  // still captured and transcribed locally via Whisper, so only the cheap wake
  // check uses the network. If Web Speech is unavailable, we fall back to the
  // manual "Enable mic" path and surface a notice.
  var wakeRec = null, wakeActive = false;

  function wakeWordIn(text) {
    if (!text) return false;
    var t = (text || '').toLowerCase().replace(/[.,!?;:]+$/, '').trim();
    if (t === 'jarvis') return true;
    // Fuzzy: any wake-word token as a standalone or trailing word.
    for (var i = 0; i < WAKE_WORDS.length; i++) {
      if (t === WAKE_WORDS[i]) return true;
      var re = new RegExp('(^|\\s)' + WAKE_WORDS[i] + '(\\s|$)', 'i');
      if (re.test(t)) return true;
    }
    return false;
  }

  function startWakeListener() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      notice('WAKE-WORD UNAVAILABLE — use Enable Mic + type, or Chrome');
      return;
    }
    if (wakeRec) { try { wakeRec.stop(); } catch (e) {} }
    wakeRec = new SR();
    wakeRec.continuous = true;
    wakeRec.interimResults = true;
    wakeRec.lang = 'en-US';
    wakeRec.onresult = function (ev) {
      // Open when JARVIS is resting: 'off' (after a reply / session close) or
      // 'idle' (freshly enabled mic, waiting for the first wake word). A bare
      // "jarvis" mid-conversation must not reset capture — Whisper routinely
      // appends the wake word to real commands, so block during active turns.
      if (mode !== 'off' && mode !== 'idle') return;
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var txt = ev.results[i][0].transcript;
        if (wakeWordIn(txt)) {
          console.log('[wake] detected: ' + txt);
          beginCapture('command', false);
          return;
        }
      }
    };
    wakeRec.onerror = function (e) {
      // 'no-speech' / 'aborted' / 'network' are benign for a continuous listener;
      // onend will re-arm us. Only a permission error is fatal.
      if (e && e.error === 'not-allowed') {

        wakeActive = false;
        return;
      }

      // it is still wanted — regardless of mode. Restarting mid-turn is harmless
      // because onresult ignores results unless mode === 'idle'. The old guard
      // (mode === 'idle') left the listener dead after the first auto-stop, which
      // looked like JARVIS "disconnecting from the mic".
      if (wakeActive) { try { wakeRec.start(); } catch (e) {} }
    };

    if (wakeActive && (!wakeRec || wakeRec.state === 'inactive') && mode !== 'nomic' && mode !== 'off') {

    }

  function stopWakeListener() {
    wakeActive = false;
    if (wakeRec) { try { wakeRec.stop(); } catch (e) {} wakeRec = null; }
  }

  // ---------------------------------------------------------------- capture engine
  // One permanent getUserMedia stream + one ScriptProcessor (PCM for the clip)
  // + one AnalyserNode (RMS for the VAD). No MediaRecorder, no start/stop
  // button, nothing that can be left in a stuck state.
  var ctx = null, srcNode = null, proc = null, sink = null, stream = null;
  var analyser = null, vadBuf = null, vadTimer = null;
  var srcRate = 48000;

  var mode = 'boot';            // boot | idle | scan | command | busy | speaking | nomic | off
  var micOk = false;            // false -> nothing to listen with; park in 'nomic'
  var ring = [], ringLen = 0, ringCap = 0;
  var cap = null, capLen = 0, capHeard = false, capWaited = 0;
  var noiseFloor = 0.004, speechMs = 0, silenceMs = 0;
  var busySince = 0, lastLevel = 0;
  // User may end the voice session by saying "...jarvis" at the end of a command.
  // When a transcript ends with the wake word, we process the command normally,
  // then close the mic instead of returning to the listening loop.
  var sessionClosePending = false;
  var lastWakeAt = 0;           // de-dupe server vs browser wake (ms epoch)

  function goIdle() {
    stopSpeakLoop();                   // idempotent: kills the RAF + resets levers
    cap = null; capLen = 0; capHeard = false; capWaited = 0;
    speechMs = 0; silenceMs = 0;
    ring = []; ringLen = 0;

    // Stop-word path: the user ended the session by saying "...jarvis". Tear the
    // mic down completely and park in 'off' so the loop does not re-arm.
    if (sessionClosePending) {
      sessionClosePending = false;
      stopMic();
      mode = 'off';
      cue('Standing by, sir.');
      setState('idle', 'VOICE SESSION ENDED — SAY "JARVIS" TO RESUME');
      dot.className = 'dead';
      if (endBtn) endBtn.classList.remove('show');
      return;
    }

    if (!micOk) {
      // No mic: park. Voice is the only input, so there is nothing else to do.
      mode = 'nomic';
      setState('idle', 'NO MIC — CLICK ENABLE MIC');
      dot.className = 'dead';
      return;
    }
    mode = 'idle';
    setState('idle', 'LISTENING FOR “JARVIS”');
    // A live mic means a voice session is active — surface the End button so
    // the user can always stop it without relying on a spoken close word.
    if (endBtn) endBtn.classList.add('show');
  }

  // Fully stop and release the microphone (used by the "...jarvis" stop-word).
  function stopMic() {
    stopWakeListener();
    teardownMic();
    micOk = false;
  }

  function pushRing(block) {
    ring.push(block); ringLen += block.length;
    while (ringLen - ring[0].length > ringCap) { ringLen -= ring[0].length; ring.shift(); }
  }

  // ---------------------------------------------------------------- earcon
  // A short blip the instant the command window opens, so "is it listening?"
  // is never a guess. Played on the mic's own AudioContext, and deliberately
  // BEFORE capture starts: the recorder must not swallow the tick and count it
  // as speech. Returns how long to wait before opening the mic, 0 if silent.
  var TICK_MS = 90;

  function playTick(freq, ms, vol) {
    if (!ctx || ctx.state !== 'running') return 0;
    try {
      var t0 = ctx.currentTime, dur = (ms || TICK_MS) / 1000;
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq || 880, t0);
      // Ramped envelope: gating a raw oscillator clicks audibly.
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
      return (ms || TICK_MS);
    } catch (e) { return 0; }
  }

  function beginCapture(kind, seed) {
    mode = kind;                       // now always 'command' (wake handled by WakeListener)
    cap = []; capLen = 0; capWaited = 0;
    // The WakeListener already confirmed the wake word, so every capture here is a
    // command. capHeard starts false; the VAD (below) flips it once real speech lands.
    capHeard = false;
    if (seed) { for (var i = 0; i < ring.length; i++) { cap.push(ring[i]); capLen += ring[i].length; } }
    ring = []; ringLen = 0;
    setState('listening', 'LISTENING…');
  }

  function endCapture() {
    var kind = mode, blocks = cap, len = capLen;
    cap = null;
    var ms = (len / srcRate) * 1000;
    if (!capHeard || ms < MIN_CLIP_MS) { goIdle(); return; }

    var flat = new Float32Array(len), off = 0;
    for (var i = 0; i < blocks.length; i++) { flat.set(blocks[i], off); off += blocks[i].length; }
    var data = b64(encodeWav(resample(flat, srcRate, TARGET_RATE)));

    mode = 'busy'; busySince = Date.now();
    setState('transcribing', 'TRANSCRIBING…');
    if (!send({ type: 'audio', data: data })) goIdle();
  }

  // The ScriptProcessor is now only a tape recorder: it buffers PCM. Every
  // decision (is this speech? is the utterance over?) belongs to vadTick().
  function onAudio(e) {
    var input = e.inputBuffer.getChannelData(0);
    if (mode === 'busy' || mode === 'speaking' || mode === 'nomic' || mode === 'boot') {
      ring = []; ringLen = 0;            // never let JARVIS hear itself
      return;
    }
    var block = new Float32Array(input); // copy, the buffer is reused
    if (mode === 'idle') { pushRing(block); return; }
    if (cap) { cap.push(block); capLen += block.length; }
  }

  // ---------------------------------------------------------------- VAD
  // AnalyserNode -> getByteTimeDomainData -> RMS, every ~50ms. The noise floor
  // is an exponential moving average of the RMS measured during silence only,
  // so it tracks fans/AC/traffic without ever learning the user's voice.
  function vadTick() {
    if (!analyser) return;
    analyser.getByteTimeDomainData(vadBuf);
    var sum = 0, i, s;
    for (i = 0; i < vadBuf.length; i++) { s = (vadBuf[i] - 128) / 128; sum += s * s; }
    var rms = Math.sqrt(sum / vadBuf.length);

    lastLevel = lastLevel * 0.7 + rms * 0.3;
    levelEl.style.width = Math.min(100, lastLevel * 900) + '%';

    if (mode === 'nomic') return;
    if (mode === 'busy' || mode === 'speaking') { speechMs = 0; silenceMs = 0; return; }

    var loud = rms > Math.max(noiseFloor * SPEECH_MARGIN, ABS_MIN_RMS);
    if (loud) {
      speechMs += VAD_TICK_MS; silenceMs = 0;
    } else {
      silenceMs += VAD_TICK_MS; speechMs = 0;
      var a = (mode === 'boot') ? WARM_ALPHA : FLOOR_ALPHA;
      noiseFloor += a * (rms - noiseFloor);
      if (noiseFloor < FLOOR_MIN) noiseFloor = FLOOR_MIN;
      if (noiseFloor > FLOOR_MAX) noiseFloor = FLOOR_MAX;
    }
    var voice = speechMs >= SPEECH_MIN_MS;

    if (mode === 'boot') return;         // still calibrating the room

    // NOTE: the idle -> scan trigger used to live here, driven by raw mic energy
    // (VAD). That let any loud noise in a busy room open a Whisper "scan" and
    // occasionally mis-fire the wake word. Wake detection is now owned by the
    // continuous Web Speech listener (WakeListener), so ambient noise can never
    // start a capture. The VAD below is only used to END a command clip.
    if (mode === 'idle') { return; }

    // command capture: VAD only decides when the utterance is over.
    if (voice) { capHeard = true; capWaited = 0; }
    else if (!capHeard) { capWaited += VAD_TICK_MS; }

    var ms = (capLen / srcRate) * 1000;
    var hang = CMD_HANG_MS;
    var max = CMD_MAX_MS;
    if ((capHeard && silenceMs >= hang) || ms >= max) { endCapture(); return; }
    if (!capHeard && capWaited >= ((mode === 'command') ? CMD_WAIT_MS : 1200)) goIdle();
  }

  // ---------------------------------------------------------------- boot
  function teardownMic() {
    // "Enable mic" can be pressed repeatedly; never stack graphs or devices.
    try { if (vadTimer) clearInterval(vadTimer); } catch (e) {}
    try { if (proc) proc.onaudioprocess = null; } catch (e) {}
    try { if (srcNode) srcNode.disconnect(); } catch (e) {}
    try { if (analyser) analyser.disconnect(); } catch (e) {}
    try { if (proc) proc.disconnect(); } catch (e) {}
    try { if (sink) sink.disconnect(); } catch (e) {}
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (ctx) ctx.close(); } catch (e) {}
    vadTimer = null; analyser = null; vadBuf = null;
    ctx = srcNode = proc = sink = stream = null;
    noiseFloor = 0.004; speechMs = 0; silenceMs = 0;
    ring = []; ringLen = 0; cap = null; capLen = 0;
  }

  async function startMic() {
    teardownMic();
    micOk = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    } catch (err) {
      mode = 'nomic';
      setDead('MIC BLOCKED — ' + (err && err.name ? err.name : 'error'));
      retryBtn.classList.add('show');
      return;
    }
    retryBtn.classList.remove('show');
    micOk = true;

    // Wake-word listener owns detection now (ambient noise must not trigger JARVIS).
    startWakeListener();

    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    srcRate = ctx.sampleRate;
    srcNode = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    ringCap = Math.ceil((PREROLL_MS / 1000) * srcRate);
    proc.onaudioprocess = onAudio;
    // ScriptProcessor only ticks when connected to the destination; a muted
    // gain node keeps the mic out of the speakers.
    sink = ctx.createGain(); sink.gain.value = 0;
    srcNode.connect(proc); proc.connect(sink); sink.connect(ctx.destination);

    // AnalyserNode drives the VAD. It is a passive tap — no output path needed.
    analyser = ctx.createAnalyser();
    analyser.fftSize = VAD_FFT;
    analyser.smoothingTimeConstant = 0;
    vadBuf = new Uint8Array(analyser.fftSize);
    srcNode.connect(analyser);
    vadTimer = setInterval(vadTick, VAD_TICK_MS);

    try { await ctx.resume(); } catch (e) {}
    if (ctx.state !== 'running') unlockBtn.classList.add('show');

    // Losing the device (unplug, OS steal) must not wedge the state machine.
    stream.getAudioTracks().forEach(function (t) {
      t.onended = function () {
        micOk = false; mode = 'nomic';
        setDead('MIC LOST — CLICK ENABLE MIC'); retryBtn.classList.add('show');
      };
    });

    mode = 'boot';
    setState('idle', 'CALIBRATING…');
    setTimeout(function () { if (mode === 'boot') goIdle(); }, CALIBRATE_MS);
  }

  unlockBtn.onclick = async function () {
    if (ctx) { try { await ctx.resume(); } catch (e) {} }
    // The playback analyser has its own context; it must be unlocked too or the
    // TTS routed through it would play silent after a gesture-gated autoplay.
    if (ampCtx) { try { await ampCtx.resume(); } catch (e) {} }
    try { await new Audio('data:audio/mp3;base64,//uQx' + 'A'.repeat(20)).play(); } catch (e) {}
    audioUnlocked = true;
    unlockBtn.classList.remove('show');
  };
  // End session button — guaranteed teardown regardless of voice state. Lets
  // the user stop JARVIS without depending on a spoken close word.
  if (endBtn) {
    endBtn.onclick = function () {
      endBtn.classList.remove('show');
      sessionClosePending = false;
      stopMic();
      mode = 'off';
      setState('idle', 'VOICE SESSION ENDED — CLICK ENABLE MIC TO RESUME');
      dot.className = 'dead';
    };
  }
  retryBtn.onclick = function () { retryBtn.classList.remove('show'); mode = 'boot'; startMic(); };

  // Watchdog: nothing may stay stuck, ever.
  setInterval(function () {
    if (mode === 'busy' && Date.now() - busySince > BUSY_TIMEOUT) {
      goIdle();
      notice('TIMED OUT — STANDBY');
    }
    if (ctx && ctx.state === 'suspended' && micOk) unlockBtn.classList.add('show');
  }, 1000);

  setHudSpeed(1);
  connect();
  startMic();
})();
</script>
</body>
</html>
