# JARVIS — pytest configuration
# Run with: python -m pytest tests/ -v
# Or for specific test: python -m pytest tests/test_brain_router.py -v -k "test_math"

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short

# Exclude dev scripts from test discovery
norecursedirs = .recovery scripts .hermes .gemini .claude playwright_shots
